<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="translations.js"></script>
    <script src="scripts.js"></script>
</head>
<body onload="initializePage()">
    <div class="container" id="auth-container">
        <h1 id="auth-title"></h1>
        <p id="enter_phone"></p>
        <input type="text" id="phone-number" placeholder="">
        <input type="submit" id="get_code" value="" onclick="showCodeField()">
    </div>
    
    <div class="container hidden" id="code-container">
        <h1 id="auth-title"></h1>
        <p id="code-instruction"></p>
        <input type="text" id="verification-code" placeholder="">
        <input type="submit" id="login" value="" onclick="showMainMenu()">
    </div>

    <div class="container hidden" id="main-menu-container">
        <h1 id="menu"></h1>
        <p id="choose_action"></p>
        <input type="submit" id="create_reservation" value="" onclick="showGameSelection()">
        <input type="submit" id="manage_reservations" value="" onclick="showReservations()">
    </div>

    <div class="container hidden" id="game-container">
        <h1 id="choose_game"></h1>
        <p id="choose_game_instruction"></p>
        <div class="game-options">
            <div class="game-option" onclick="selectGame('pool')" id="game_pool"></div>
            <div class="game-option" onclick="selectGame('pyramid')" id="game_pyramid"></div>
            <div class="game-option" onclick="selectGame('tennis')" id="game_tennis"></div>
        </div>
        <input type="submit" id="next_game" value="" onclick="showSchedule()">
    </div>
    
    <div class="container hidden" id="schedule-container">
        <h1 id="schedule"></h1>
        <p id="choose_date_time"></p>
        <input type="text" id="date-picker" class="date-picker" readonly>
        <div class="schedule">
            <!-- Динамически добавляемые элементы -->
        </div>
        <input type="submit" id="next_schedule" value="" onclick="showConfirmation()">
    </div>

    <div class="container hidden" id="confirmation-container">
        <h1 id="check_details"></h1>
        <div class="confirmation">
            <p id="address"></p>
            <p id="confirmation-phone"></p>
            <p id="confirmation-name"></p>
            <p id="confirmation-game"></p>
            <p id="confirmation-date"></p>
            <p id="confirmation-time"></p>
        </div>
        <input type="submit" id="pay" value="" onclick="finalizeBooking()">
    </div>

    <div class="container hidden" id="reservations-container">
        <h1 id="manage_reservations"></h1>
        <div class="reservations">
            <!-- Пример ранее сделанных броней -->
            <div class="reservation">Бронь 1 - Пул - 2023-08-10 10:00 <button onclick="cancelReservation()">Отменить</button> <button onclick="rescheduleReservation()">Перенести</button></div>
            <div class="reservation">Бронь 2 - Теннис - 2023-08-11 12:00 <button onclick="cancelReservation()">Отменить</button> <button onclick="rescheduleReservation()">Перенести</button></div>
            <!-- Добавьте дополнительные брони по мере необходимости -->
        </div>
        <input type="submit" id="create_reservation" value="" onclick="showGameSelection()">
        <p id="contacts-address"></p>
        <p id="contacts-phone"></p>
    </div>

    <div class="language-switcher">
        <a href="#" onclick="switchLanguage('ru')">Русский</a>
        <a href="#" onclick="switchLanguage('uk')">Українська</a>
        <a href="#" onclick="switchLanguage('en')">English</a>
        <a href="#" onclick="switchLanguage('de')">Deutsch</a>
    </div>
</body>
</html>
