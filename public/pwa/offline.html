<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17221B">
    <title>Немає з'єднання — бронювання клубу</title>
    <style>
        * { box-sizing: border-box; }
        body {
            align-items: center;
            background: #f7f7f7;
            color: #17221b;
            display: flex;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        main { max-width: 440px; }
        .ball {
            align-items: center;
            background: #05973d;
            border: 12px solid #f39314;
            border-radius: 50%;
            color: #fff;
            display: inline-flex;
            font-size: 44px;
            font-weight: 700;
            height: 112px;
            justify-content: center;
            margin-bottom: 24px;
            width: 112px;
        }
        h1 { font-size: 28px; margin: 0 0 12px; }
        p { color: #6e7270; font-size: 18px; line-height: 1.5; margin: 0 0 24px; }
        button {
            background: #f39314;
            border: 0;
            border-radius: 24px;
            color: #fff;
            cursor: pointer;
            font-size: 17px;
            font-weight: 600;
            padding: 12px 24px;
        }
    </style>
</head>
<body>
<main>
    <div class="ball" aria-hidden="true">8</div>
    <h1>Немає з'єднання з інтернетом</h1>
    <p>Перевірте підключення та спробуйте відкрити сторінку бронювання ще раз.</p>
    <button type="button" onclick="window.location.reload()">Повторити</button>
</main>
</body>
</html>
